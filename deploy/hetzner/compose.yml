# Boundry CI on the shared Hetzner host. A SEPARATE compose project (/opt/boundry-ci): it never edits
# /opt/boundry/compose.yml, the `boundry` network, or any existing volume. Conventions follow
# appboundry/deploy/boundry (loopback-only ports in 21000-21099, read-only containers, dedicated uids,
# immutable image tags, secrets in 0600 files under /etc/boundry-ci).
#
# FeltDB: a DEDICATED feltdb-server instance for CI state, using the same FeltDB image as the platform.
# Reason (evidence): feltdb-server serializes reads and writes on one lock (crates/feltdb-server/src/main.rs
# ~9541), so CI log/lease traffic on the production instances would contend with production workloads.
# Same product, same backup tooling, separate failure domain.
name: boundry-ci

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  labels: { com.boundry.owner: boundry-ci }

services:
  ci-feltdb:
    <<: *hardening
    image: ${BCI_FELTDB_IMAGE:?set the same immutable FeltDB image tag the platform uses}
    container_name: boundry-ci-feltdb
    user: "21031:21031"
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    environment:
      FELTDB_ENVIRONMENT: production
      FELTDB_DATA_DIR: /srv/feltdb/ci
      FELTDB_BACKUP_DIR: /srv/feltdb/ci/backups
      FELTDB_BIND_ADDR: 0.0.0.0:8080
      FELTDB_NAMESPACE: boundry-ci
    env_file: /etc/boundry-ci/secrets/feltdb.env   # FELTDB_MASTER_KEY, FELTDB_SESSION_SECRET (names only here)
    volumes: ["/var/lib/boundry-ci/feltdb:/srv/feltdb/ci"]
    ports: ["127.0.0.1:21031:8080"]
    networks: [boundry-ci]
    healthcheck: { test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"], interval: 15s, timeout: 5s, retries: 4, start_period: 20s }

  ci-control:
    <<: *hardening
    image: ${BCI_CONTROL_IMAGE:?set the immutable boundry-ci image tag}
    container_name: boundry-ci-control
    user: "21030:21030"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    depends_on: { ci-feltdb: { condition: service_healthy } }
    environment:
      BCI_LISTEN: 0.0.0.0:8080
      BCI_FELTDB_URL: http://boundry-ci-feltdb:8080
      BCI_FELTDB_TOKEN_FILE: /run/secrets/feltdb-token
      BCI_WEBHOOK_SECRET_FILE: /run/secrets/github-webhook
      BCI_OPERATOR_TOKENS_FILE: /run/secrets/operators
      BCI_GITHUB_APP_ID: ${BCI_GITHUB_APP_ID:?}
      BCI_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
      BCI_GITHUB_INSTALLATIONS: ${BCI_GITHUB_INSTALLATIONS:?owner=installationId}
      BCI_SECRETS_DIR: /run/repo-secrets
      BCI_DATA_DIR: /srv/boundry-ci
      BCI_PUBLIC_URL: https://${BCI_PUBLIC_HOST:?}
      BCI_CAS_MIN_FREE_BYTES: "21474836480"   # refuse artifact writes below 20 GiB free on the volume
    volumes:
      - /var/lib/boundry-ci/data:/srv/boundry-ci
      - /etc/boundry-ci/secrets/control:/run/secrets:ro
      - /etc/boundry-ci/repo-secrets:/run/repo-secrets:ro
    ports: ["127.0.0.1:21030:8080"]
    networks: [boundry-ci]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 4, start_period: 10s }

networks:
  boundry-ci:
    name: boundry-ci
    driver: bridge
    driver_opts: { com.docker.network.bridge.name: br-boundry-ci }
    ipam: { config: [{ subnet: 172.31.8.0/24 }] }   # confirm free with ci-preflight.sh before first start
