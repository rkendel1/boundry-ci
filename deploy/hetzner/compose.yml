# Boundry CI on the shared Hetzner host. A SEPARATE compose project: it never edits /opt/boundry,
# the platform `boundry` network, or any existing volume. Conventions follow appboundry/deploy/boundry
# (loopback-only ports, read-only containers, dedicated uids, immutable image tags verified by config
# digest, secrets in 0440/0600 files). Every ${...} value is rendered per release into
# /opt/boundry-ci/releases/<id>/release.env by `boundry-ci deploy` — this file is not run by hand.
#
# FeltDB: a DEDICATED instance for CI state, same FeltDB image as the platform. Evidence: feltdb-server
# serializes every read and write on one mutex (crates/feltdb/src/lib.rs `inner: Arc<Mutex<Inner>>`);
# measured with tools/bench/feltdb-contention.ts, 16 concurrent CI log writers raised a small read's p50
# from 1.2 ms to 19.5 ms with stalls up to 3.7 s. CI must not share that lock with production.
name: boundry-ci

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  labels: { com.boundry.owner: boundry-ci }

services:
  ci-feltdb:
    <<: *hardening
    image: ${BCI_FELTDB_IMAGE:?}
    user: "21031:21031"
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    environment:
      FELTDB_ENVIRONMENT: production
      FELTDB_DATA_DIR: /srv/feltdb/ci
      FELTDB_BACKUP_DIR: /srv/feltdb/ci/backups
      FELTDB_BIND_ADDR: 0.0.0.0:8080
      FELTDB_NAMESPACE: boundry-ci
    env_file: ${BCI_ETC:?}/secrets/feltdb.env   # FELTDB_MASTER_KEY, FELTDB_SESSION_SECRET, FELTDB_GRANT_SIGNING_KEY
    volumes: ["${BCI_VAR:?}/feltdb:/srv/feltdb/ci"]
    ports: ["127.0.0.1:${BCI_PORT_FELTDB:?}:8080"]
    networks: [ci]
    healthcheck: { test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"], interval: 15s, timeout: 5s, retries: 4, start_period: 20s }

  ci-control:
    <<: *hardening
    image: ${BCI_CONTROL_IMAGE:?}
    user: "21030:21030"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    depends_on: [ci-feltdb]
    environment:
      BCI_REVISION: ${BCI_REVISION:?}
      BCI_LISTEN: 0.0.0.0:8080
      BCI_FELTDB_URL: http://ci-feltdb:8080
      BCI_FELTDB_TOKEN_FILE: /run/secrets/feltdb-token
      BCI_WEBHOOK_SECRET_FILE: /run/secrets/github-webhook
      BCI_OPERATOR_TOKENS_FILE: /run/secrets/operators
      BCI_GITHUB_APP_ID: ${BCI_GITHUB_APP_ID}
      BCI_GITHUB_PRIVATE_KEY_FILE: ${BCI_GITHUB_KEY_FILE}
      BCI_GITHUB_INSTALLATIONS: ${BCI_GITHUB_INSTALLATIONS}
      BCI_SECRETS_DIR: /run/repo-secrets
      BCI_DATA_DIR: /srv/boundry-ci
      BCI_PUBLIC_URL: ${BCI_PUBLIC_URL}
      BCI_CAS_MIN_FREE_BYTES: ${BCI_CAS_MIN_FREE_BYTES:?}
      BCI_LEASE_MS: ${BCI_LEASE_MS:?}
      BCI_CANARY_IMAGE: ${BCI_CANARY_IMAGE:?}
    volumes:
      - ${BCI_VAR:?}/data:/srv/boundry-ci
      - ${BCI_ETC:?}/secrets/control:/run/secrets:ro
      - ${BCI_ETC:?}/repo-secrets:/run/repo-secrets:ro
    ports: ["127.0.0.1:${BCI_PORT_CONTROL:?}:8080"]
    networks: [ci]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 4, start_period: 10s }

networks:
  ci:
    name: ${BCI_NETWORK:?}
    driver: bridge
    ipam: { config: [{ subnet: "${BCI_SUBNET:?}" }] }
